<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="css/all.css" />
    <link rel="stylesheet" href="css/bootstrap.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div
      class="bg-body-secondary vh-100 d-flex justify-content-center align-items-center"
    >
      <div class="col-lg-3 col-md-4 col-sm-9 col-11 p-xl-5 p-md-0 p-4">
        <div class="rounded-4 shadow-lg bg-light p-3">
          <div class="mb-2">
            <form class="py-3">
              <input type="text" class="form-control bg-danger myInput" />
            </form>
          </div>
          <div class="w-100 d-flex justify-content-center mb-4">
            <div class="row justify-content-center">
              <div class="col-12 d-flex justify-content-evenly mb-2 gap-1">
                <button
                  type="button"
                  class="btn btn-secondary rounded-5 px-3 myNumber"
                >
                  7</button
                ><button
                  type="button"
                  class="btn btn-secondary rounded-5 px-3 myNumber"
                >
                  8</button
                ><button
                  type="button"
                  class="btn btn-secondary rounded-5 px-3 myNumber"
                >
                  9</button
                ><button
                  type="button"
                  class="btn btn-secondary rounded-5 px-3 myOperator"
                >
                  +
                </button>
              </div>
              <div class="col-12 d-flex justify-content-evenly mb-2 gap-1">
                <button
                  type="button"
                  class="btn btn-secondary rounded-5 px-3 myNumber"
                >
                  4</button
                ><button
                  type="button"
                  class="btn btn-secondary rounded-5 px-3 myNumber"
                >
                  5</button
                ><button
                  type="button"
                  class="btn btn-secondary rounded-5 px-3 myNumber"
                >
                  6</button
                ><button
                  type="button"
                  class="btn btn-secondary rounded-5 px-3 myOperator"
                >
                  -
                </button>
              </div>
              <div class="col-12 d-flex justify-content-evenly mb-2 gap-1">
                <button
                  type="button"
                  class="btn btn-secondary rounded-5 px-3 myNumber"
                >
                  1</button
                ><button
                  type="button"
                  class="btn btn-secondary rounded-5 px-3 myNumber"
                >
                  2</button
                ><button
                  type="button"
                  class="btn btn-secondary rounded-5 px-3 myNumber"
                >
                  3</button
                ><button
                  type="button"
                  class="btn btn-secondary rounded-5 px-3 myOperator"
                >
                  *
                </button>
              </div>
              <div class="col-12 d-flex justify-content-evenly mb-2 gap-1">
                <button
                  type="button"
                  class="btn btn-secondary rounded-5 px-3 myNumber"
                >
                  0</button
                ><button
                  type="button"
                  class="btn btn-secondary rounded-5 px-3 myOperator"
                >
                  /
                </button>
                <button
                  type="button"
                  class="btn btn-danger rounded-5 deleteAll"
                >
                  del</button
                ><button
                  type="button"
                  class="btn btn-danger rounded-5 px-3 deleteOneElement"
                >
                  C
                </button>
              </div>
              <div class="col-12 row px-4">
                <button type="button" class="btn btn-success col-12">=</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/all.js"></script>
    <script src="js/bootstrap.bundle.js"></script>
    <script src="js/style.js"></script>
  </body>
</html>
